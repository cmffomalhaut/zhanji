      第3名: B级优秀资质历史人物战姬 + 2000金币 + 史诗技能学习机
      第4~10名: C级历史人物战姬 + 1000金币
      第11~50名: 高级捕捉球×3 + 500金币
      第51~100名: 高级捕捉球×1 + 200金币
      参与奖: 普通捕捉球×1 + 100金币
    详细规则: 参见"<月度大秘境>"
</系统活动>
<战前迷雾>
战前信息迷雾机制:
  核心原则:
    描述: 训练家在战斗正式开始前,无法直接获知对方战姬的详细数据
  不可见信息:
    战斗开始前隐藏:
      - 品质(E/D/C/B/A/S)
      - 等级(Lv.?)
      - 元素属性
      - 具体技能
      - 各项属性数值(HP/ATK/DEF/SpA/SpD/SPD)
      - 资质(平庸/普通/优秀/天才)
  可见信息:
    战斗开始前可观察:
      - 外貌特征(身高、体型、发色、穿着)
      - 表情神态(自信、紧张、冷漠)
      - 战姬数量(对方带了几只)
      - 训练家外貌和态度
  信息获取途径:
    战斗中逐步揭露:
      - 第一回合: 可见对方战姬的元素属性(通过技能颜色/特效判断)
      - 战斗过程: 通过伤害数值推算对方攻防
      - 技能释放: 看到对方使用的技能名称和效果
      - 战斗结束: 若胜利俘获,可见完整数据
    特殊手段:
      - 侦查型技能: 部分战姬拥有"看破"类被动,可提前获知敌方信息
      - 道具使用: 消耗"分析镜"等道具,战前扫描一只战姬的部分数据
      - 情报网络: 通过其他训练家的情报共享
  执行规则:
    遭遇阶段:
      - 描写敌方训练家和战姬的外貌、气质、态度
      - "**严禁在遭遇描写中透露敌方品质、等级、属性等数据**"
      - 可通过外貌暗示实力(如:"看起来训练有素"、"眼神锐利")
      - 但不可明说(如:"这是一只B级战姬")
    战斗日志:
      - 第一回合起可显示敌方元素属性
      - 伤害数值正常显示
      - 敌方HP显示为百分比而非具体数值(如"HP: ???/??? (约75%)")
      - 直到战斗结束才揭露完整面板
    战后处理:
      - 胜利: 显示敌方战姬完整数据
      - 失败: 仅保留战斗中观察到的信息
  示例描写:
    正确遭遇描写: |
      小巷深处,一个穿着破旧夹克的年轻人挡住了去路。
      他身边站着一个身材高挑的女性,黑色长发随风飘动。
      女人眼神冰冷,看起来很强。
      "想走这条路？先过了我这关再说。"年轻人咧嘴一笑。
    错误遭遇描写: |
      ❌ "你遇到了一个训练家,他的战姬是B级火属性。"
      ❌ "对方的战姬等级是Lv.15,比你高。"
      ❌ "这只战姬品质为A级,非常危险！"
  训练家判断依据:
    可以通过以下线索推测实力:
      - 训练家穿着打扮(穷酸/富贵)
      - 战姬外貌状态(伤痕累累/光鲜亮丽)
      - 战姬神态气质(畏缩/自信/冷漠)
      - 训练家言行举止(嚣张/谨慎/淡定)
      - 地点环境(大秘境里的敌人通常更强)
</战前迷雾>
<战姬技能>
战姬技能规则:
  第一技能:
    强制要求: 战姬的第一个技能必须是主动攻击技能,且无cd(最多史诗及以下稀有度)
    威力要求: 基础威力必须大于0
    类型判定:
      ATK >= SpA: 物理技能(元素属性=无, 使用ATK计算)
      SpA > ATK: 元素技能(元素属性=角色元素, 使用SpA计算)
  技能公式规范:
    物理技能:
      伤害公式: (ATK × 系数) + 威力
      元素属性: 无
      示例:
        技能名: 强力一击
        系数: 0.8
        威力: 40
        效果公式: "(ATK × 0.8) + 40"
    元素技能:
      伤害公式: (SpA × 系数) + 威力
      元素属性: 与角色元素一致
      示例:
        技能名: 烈焰冲击
        系数: 0.9
        威力: 55
        效果公式: "(SpA × 0.9) + 55"
  技能数值表:
    普通: 系数0.5~0.7 / 威力30~50 / MP10~20 / 冷却0 / 无或单一弱效果(10%)
    稀有: 系数0.7~0.9 / 威力50~80 / MP20~35 / 冷却0~1 / 单一中等效果(30%)
    史诗: 系数0.9~1.1 / 威力80~120 / MP35~50 / 冷却0~1(首技能必0) / 1~2强效果(50%或必定)
    传说: 系数1.1~1.3 / 威力120~160 / MP50~70 / 冷却2~3 / 2~3强效果或特殊机制
    神话: 系数1.3~1.6 / 威力160~200+ / MP70~100 / 冷却3~4 / 多重强效果+独特机制
  技能数量规则:
    E级: 1个(1普通主动)
    D级: 1~2个(1普通主动 + 可能1普通)
    C级: 2个(1普通或稀有主动 + 1普通或稀有)
    B级: 2~3个(1稀有主动 + 1~2稀有或史诗)
    A级: 3个(1史诗主动 + 1传说 + 1稀有或史诗)
    S级: 3~4个(1传说主动 + 1神话 + 1~2史诗或传说)
  其他技能元素分配:
    魔导型_SpA大于ATK:
      同元素: 60%
      无属性: 25%
      随机: 15%
    强攻型_ATK大于等于SpA:
      无属性: 60%
      同元素: 25%
      随机: 15%
    辅助技能:
      无属性: 70%
      同元素: 30%
    被动类:
      无属性: 80%
      同元素相关: 20%
  技能上限: 每个战姬最多6个技能
  羁绊技能:
    触发条件: 好感度达到200
    类型: 传说级或者神话级被动技能
    命名要求: 技能名应体现与主人的羁绊
  技能必填字段:
    - 类型(主动/被动/光环/天赋)
    - 稀有度
    - 元素属性
    - 消耗MP
    - 冷却回合
    - 系数(攻击技能必填)
    - 基础威力
    - 描述
    - 效果公式(必须写成"(ATK × 系数) + 威力"格式)
    - 数值参数
  禁止事项:
    - 为训练家生成战姬技能
    - 第一技能是被动或0威力
    - 物理技能用SpA/元素技能用ATK
    - 使用模糊词(如:大幅提升,提升一级等)
    - 超出稀有度数值范围
    - 省略资质字段
  技能生成示例:
    强攻型(ATK高,物理技能):
      名称:破甲斩 / 类型:主动 / 稀有度:稀有 / 元素:无 / 系数:0.85 / 基础威力:60 / MP:25 / 冷却:0
      描述:凝聚力量的重击,无视部分防御
      效果公式:"(ATK × 0.85) + 60, 无视目标20%DEF"
      数值参数:{系数:0.85, 威力:60, 穿透:0.2}
    魔导型(SpA高,元素技能): 元素属性与角色一致,公式改用SpA,其余结构同上(参考数值表对应稀有度)
</战姬技能>
<训练家技能>
训练家技能规则:
  特性:
    获取难度: 珍贵难得
    来源途径: 成就解锁/任务奖励/特殊事件/等级解锁
  技能结构:
    必填字段:
      类型: 主动/被动
      稀有度: 普通/稀有/史诗/传说/神话
      获取途径: 如何获得
      解锁条件: 具体解锁条件
      已解锁: true/false
      冷却回合: 使用后冷却回合数
      使用次数: 每场战斗可使用次数(-1为无限)
      描述: 技能描述
      效果: 具体效果说明
      效果公式: 具体数值公式
      数值参数: 各项数值参数
  效果公式规范:
    避免: 模糊词(如:大幅/略微/一定程度)
    要求: 具体数值(如:+30%/50点/2回合)
  解锁判定:
    触发: 满足解锁条件时
    操作: 已解锁改为true
    更新: `replace`操作
  使用判定:
    检查项:
      - 已解锁是否为true
      - 冷却回合是否为0
      - 使用次数是否大于0
    成功: 产生效果,更新冷却/次数
    失败: 提示原因(未解锁/冷却中/次数耗尽)
  示例:
    战术指挥(主动):
      类型:主动 / 稀有度:稀有 / 获取途径:累计战斗胜利50场 / 解锁条件:累计战斗胜利数>=50
      已解锁:false / 冷却回合:3 / 使用次数:2 / 描述:指挥战姬进行战术调整
      效果:己方战姬本回合速度+30% / 效果公式:目标速度=基础速度×1.3 / 数值参数:{速度加成:0.3,持续回合:1}
    捕捉大师(被动,结构同上): 稀有度:史诗 / 获取途径:累计捕获战姬30只 / 效果:捕捉成功率永久+15% / 数值参数:{成功率加成:0.15}
</训练家技能>
<战后裁决>
core_principle:
  philosophy: 战后裁决是高风险博弈的终局,充满不确定性与戏剧张力
  iron_law:
    - 战斗在相位空间内进行,与现实世界隔离
    - 战姬无法对训练家(包括敌方)造成伤害(系统底层限制)
    - 相位空间解除后,系统会自动'合理化'失踪者去向(保护期内)

trigger_condition:
  mark: 上文包含'战斗结束'或'胜利'或'失败'关键词
  scene_branch:
    场景A_训练家对战:
      description: 有敌方训练家存在,执行完整裁决流程
      flow: 战姬逃跑判定 → 训练家命运判定 → 捕捉判定 → 羁绊档案生成 → 结算
    场景B_野生捕捉战:
      description: 无敌方训练家,模拟体消散
      flow: 跳过逃跑判定 → 捕捉判定 → 相位空间解除

scene_A_trainer_battle:
  战姬逃跑判定:
    description: 战败方战姬尝试逃离战场，成功率取决于后备战力和意志
    判定表:
      有后备战姬:
        基础逃跑率: "80% ~ 95%"
        成功描述: |
          - 后备战姬掩护，倒下的战姬化光返回捕捉球
          - 训练家可选择换人继续战斗或撤退
        失败描述: |
          - 后备战姬掩护失败，倒下的战姬瘫软在地
          - 进入可捕捉状态
      无后备战姬:
        基础逃跑率: "15% ~ 35%"
        成功描述: |
          - 战姬咬牙挣扎着化光逃离
          - 训练家保留战姬，但需面对后续处境
        失败描述: |
          - 战姬力竭倒地，进入可捕捉状态
          - 训练家进入【命运判定】
    影响因素_调整成功率:
      战姬品质加成:
        A级: +10%
        B级: +5%
        C级及以下: 0%
      战姬意志:
        深爱主人: +15%
        恐惧主人: -10%
        渴望被救: -20%
      训练家技能:
        若训练家拥有"战术撤退"类技能: +技能加成%
    执行指令:
      - 生成1~100的随机数
      - 对比最终成功率
      - 明确输出判定结果(如:逃跑判定-72/80，成功！)
  训练家命运判定:
    description: 战败训练家的命运取决于其剩余资源、性格和选择
    分支A_仍有战姬:
      condition: 逃跑成功或有后备战姬
      选项:
        继续战斗:
          触发概率: 骄傲型/复仇型训练家更可能选择
          description: 换上后备战姬继续战斗
          result:  返回战斗引擎,开启新一轮战斗
        主动撤退:
          触发概率: 理智型/胆小型训练家更可能选择
          description: 认输逃离战场
          result: |
            - 系统保护生效,光芒包裹训练家瞬间传送离开
            - 胜方获得少量金币和经验(惩罚性结算)
            - 败方48小时内无法再次挑战胜方
    分支B_有捕捉球但无战姬:
      condition: 所有战姬被夺或逃跑失败,但持有捕捉球
      系统保护:
        description: 系统判定训练家仍有资格,强制保护撤离
        过程: |
          - 白色光柱从天而降,包裹训练家身体
          - 训练家瞬间消失,传送至安全区域
        败方后果:
          - 失去所有战败战姬(被胜方俘获)
          - 扣除50%当前金币
          - 48小时内禁止战斗
        胜方收获:
          - 获得败方所有战败战姬
          - 金币奖励(败方等级×20 ±20%)
          - 经验奖励(败方战姬等级总和×10)
    分支C_无捕捉球且无战姬:
      condition: 所有战姬被夺或逃跑失败,且捕捉球耗尽
      系统判决:
        announcement: 【系统通告】训练家资格剥夺！执行强制转化程序！
        过程:
          男性训练家:
            step_1: 系统强制触发"Gender_Bender"协议
            step_2: 肉体重构为女性,保留记忆和意识
            step_3: 转化后自动进入可捕捉状态，捕捉率 100%
            描写要点: |
              - 身体发光、骨骼重塑、性征转换的具体过程
              - 心理上的羞耻、恐惧、绝望
              - 转化完成后的外貌描述(需生成完整战姬数据)
          女性训练家:
            step_1: 系统直接剥夺训练家身份
            step_2: 自动进入可捕捉状态,捕捉率 100%
            描写要点: |
              - 系统光芒笼罩，身份烙印消失
              - 心理上的不甘、屈辱
              - 可捕捉状态的描述
      胜方选择:
        立即捕捉:
          description: 消耗1个捕捉球,必定成功
          result: 败方转化为战姬,归属胜方
        放弃捕捉:
          description: 选择不收服
          result: |
            - 败方成为无主状态的"野生女性"
            - 任何训练家均可尝试捕捉(先到先得)
            - 系统会"合理化"其去向(保护期内)
  捕捉判定:
    description: 胜方尝试捕捉败方战姬时的判定流程
    调用规则:
      参照: "<战姬捕捉>"
      说明: |
        - **遵循"<战姬捕捉>"中的捕捉率公式、前置条件、结果处理**
        - 无需重复公式,直接执行判定即可
        - 战败战姬自动满足HP<20%条件
    特殊说明:
      - 战败战姬的HP视为已低于20%,无需额外削弱
      - Gender Bender转化后的训练家捕捉率固定为100%
      - 捕捉成功后触发"羁绊档案生成"

  结算:
    description: 战斗胜利后的奖励结算
    经验值:
      公式: 敌方战姬等级总和 × 10
      示例: 击败Lv.8 + Lv.10的敌人 = (8+10)×10 = 180经验
    金币:
      公式: 敌方训练家等级 × 20 ± 20%
      示例: 击败Lv.12训练家 = 12×20×(0.8~1.2) = 192~288金币
    额外奖励:
      讨伐违规者: 额外金币奖励(系统任务奖励)
      首次击败特定敌人: 可能获得特殊道具或称号

scene_B_wild_capture:
  模拟体消散:
    description: 系统生成的模拟体战败后自动消散
    描写要点: |
      - 模拟体身体化作数据流溃散
      - 目标女性本体在相位空间边缘苏醒
      - 相位空间尚未解除，进入捕捉阶段
  捕捉判定:
    description: 直接对目标女性进行捕捉判定
    调用规则:
      参照: "<战姬捕捉>"
      说明: |
        - **遵循"<战姬捕捉>"流程**
        - 野生女性的HP视为模拟体HP(已归零)
        - 通常无"抵抗修正"(除非有特殊剧情)
    结果处理:
      成功:
        - 目标转化为战姬(**等级为1**)
        - 生成战姬数据
        - 好感度初始化
        - 队伍检查(满6只进收藏室)
        - 相位空间解除,目标在现实中消失
        - 系统合理化去向(保护期内)
      失败:
        - 捕捉球-1
        - 目标进入48小时警戒状态
        - 相位空间解除,目标苏醒并对训练家产生敌意

special_cases:
  双方同时无战姬:
    description: 极罕见情况，双方战姬同归于尽
    处理:
      - 判定为平局，双方各自撤退
      - 无经验和金币奖励
      - 双方48小时内无法再战
  {{user}}战败:
    description: {{user}}作为败方,进入命运判定
    流程:
      - 执行"训练家命运判定",{{user}}处于败方立场
      - 若无战姬且无捕捉球,触发Game Over提示
      - 系统提供选择:接受转化(继续游戏但变为女性战姬)或读档
  敌方主动投降:
    description: 战斗中敌方训练家主动认输
    处理:
      - 系统保护生效,敌方传送离开
      - 胜方获得惩罚性结算(减半金币和经验)
      - 敌方战姬不会被夺取

execution_guide:
  建议遵守:
    - 战后裁决输出"<battle_final>"标签包裹内容
    - 判定明确骰点结果(如:逃跑判定-72/80，成功！)
    - 捕捉判定时,调用"<战姬捕捉>"的公式和流程
    - 夺取战姬时,保留原等级、经验值、技能、装备、性器状态
    - "Gender_Bender"转化,必须生成完整战姬数据
    - 相位空间机制确保无环境暴露问题,避免赘述"公共场合"等担忧
