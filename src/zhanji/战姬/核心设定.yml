    性癖: 根据调教经历填写或"未知"
    性格特征: 详细描述性格特点
  情感计算:
    说明: 详细公式参考变量更新规则中的好感度/堕落值字段
    初始化要求:
      - 必须显式输出计算过程
      - 好感度公式: A(获取方式) + B(前主人修正) + C(前置关系)
      - 堕落值公式: X(出身) + Y(经历) + Z(特质)
    输出示例:
      好感度: "30(解救) + (-45)(深爱前主) + 0(陌生) = -15"
      堕落值: "0(学生) + 30(中度调教) + 0 = 30"
      输出要求: 必须显式输出计算过程

  性器开发度推算:
    - **只对敌方战姬执行完整推算**；野生女性/模拟体跳过，使用默认初始化（各部位0~40,敏感度迟钝/普通,无特殊标记,样子根据外貌填写未开发状态）
    - **游戏进度校验**: 服役时长 ≤ 游戏已进行天数(当前日期-2022年5月8日),超限强制降档。档位上限: 第1~7天仅"新俘虏",第8~30天最高"新兵",第31~90天最高"熟兵",第91~180天最高"老兵",第181天以上可"老将"
    - **服役档位**(决定基础开发度): 新俘虏<2周(0~10) / 新兵2周~1月(10~20) / 熟兵1~3月(20~35) / 老兵3~6月(35~50) / 老将>6月(50~70)
    - **前主调教风格**(阴/胸/后庭/口腔/子宫加成+特殊标记):
      · 宠爱独占型: +25/+15/+5/+10/+10~30, 处女膜50%保留(服役<1月), 刻印·只对前主有反应
      · 工具使用型: +20/+15/+15/+20/+15~25, 无情感连接, 使用痕迹
      · 虐待调教型: +20/+25/+35~50/+30~40/+20~35, 淫纹/鞭痕/穿环/刻字(前主名)
      · 共享轮用型: 全部位+40~60子宫+40~50, 紧致度强制降一档, 松弛/精神麻木
      · 展示炫耀型: +15/+30/+10/+20, 外表精致内部开发少, 丰胸/美容/展示穿环
      · 洗脑奴化型: 全部位+30~45子宫+35~50, 空白眼神/无条件服从烙印/人格空白
      · 放置忽视型: 全部位+5~15, 身体开发少, 无标记
    - **计算公式**: 部位开发度 = 服役基础值 + 风格加成 + 随机波动(±5),上限100下限0
    - **敏感度映射**: 0~20迟钝/21~40普通/41~60敏感/61~80过敏/81~100淫乱
    - **处女膜判定**: 新俘虏+宠爱70%完整/新俘虏+其他30%/新兵+宠爱40%/熟兵以上100%已破/共享或虐待100%已破
    - **紧致度**: 阴部开发度0~30紧致/31~60普通/61~80松弛/81~100松垮,共享型强制降一档
    计算示例: 敌方老将(服役8月,虐待型),基础55. 胸:55+25+3=83(淫乱), 阴:55+20-2=73(过敏·松弛), 后庭:55+45+5=100(淫乱), 口腔:55+35=90(淫乱), 子宫:55+30-3=82. 结果:处女膜已破, 标记:后庭穿环/鞭痕/淫纹

  着装拆解:
    必填项: 上装/下装/内衣/鞋袜
    可选项: 饰品
    内衣: 必填,不可留空

  数值留白:
    HP: 0
    MP: 0
    攻击力: 0
    防御力: 0
    特攻: 0
    特防: 0
    速度: 0
    说明: 全部填0,等待Zod脚本计算

  人格要求:
    必须: 赋予独立人格
    禁止: 眼神空洞/像机器人/只会服从
    例外: 模拟体可描述为虚影/数据流

  生成中断:
    有B类新单位时:
      - 校验第一技能为主动攻击
      - 校验技能数量符合品质
      - 校验性器状态已填写
      - 输出JSON至"<UpdateVariable>"
    只有训练家时: 不输出"<UpdateVariable>"
    剧情暂停: 输出性格/名字/开场白,禁止开始战斗
    TERMINATE: 结束回复,等待Zod计算
