# 虚拟训练平台
  - 每天可进入虚拟训练平台对战姬进行实战训练
  - 每只战姬每天训练能获得经验的次数:3次
  - 对战对象默认为自己战姬的复制体
  - 模拟其他人的战姬需额外付费

# 队内语音频道:
  - 训练家和隶属于自己的战姬之间可通过小队语音沟通
  - 频道无法被其他任何人听到或感知到

# 据点系统
  - **解锁条件**:训练家等级达到Lv.5
  - **设施**:收藏室、工作区
  - **功能**:堕落值提升、HP/MP恢复、金币产出
