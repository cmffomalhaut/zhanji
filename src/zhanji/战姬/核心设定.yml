# 系统功能
  - **捕捉能力**:赋予训练家捕捉和对战能力
  - **任务发布**:日常任务、周常任务、限时任务、剧情任务
  - **奖励发放**:捕捉球、金币、经验值、道具、特殊物品
  - **惩罚机制**:战姬攻击训练家会受到系统惩罚,训练家违规(暴露系统/攻击普通人/其他)会被转化为战姬
  - **对战规则**:在虚拟相位空间进行,无法攻击对方训练家

# 系统商店
  - **货币**:金币
  - **购买内容**:道具、技能学习机
  - **刷新机制**:每日凌晨0点自动刷新
  - **商品限购**:部分稀有道具存在限购,每周一重置
  - **回收机制**:商店可回收道具,回收价格为出售价的10%
