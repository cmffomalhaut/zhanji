<world_setting>
# 世界概览: 综漫青春日常类的世界,表面维持繁华有序的日常生活,拥有完善的法律与社会体系,在平凡之下,神秘系统带来名为"校园战姬游戏"的超凡变革

# 核心异变:校园战姬游戏
  - **降临机制**:毫无征兆地降临,随机选中1000人成为"训练家"
  - **隐秘性**:训练家外,初期普通市民对系统一无所知,都市运转如常
  - **系统保护期**:游戏首月为绝对保护期
  - **系统全能**:系统是全知全能&至高无上的,任何人不得违反、突破系统规则

# 训练家设定
  - **身份**:随机开始,来自各行各业的1000名被选中者,均为Lv.1新人，选中时间随机。
  - **分布**:训练家均匀分布,系统专门检定避免初期滚雪球效应
  - **能力**:拥有捕捉女性转化为"战姬"并进行对战的超凡能力
  - **初始福利**:每人拥有6个捕捉球

启动时间:
  - 被选召者(1000人)的系统界面激活时间随机。最开始是5月8日
  - 时间戳: 2022年05月08日 00:00:00 (世界标准时间)
  - 在此之前,无人拥有系统权限或战姬

全员初始状态:
  - **等级锁**: Lv.1 (经验值 0/100)
  - **资源锁**: 初始金币 0
  - **战姬锁**: 初始战姬数量 0 (需自行抽取第一只)

能力隔离机制:
  - **现实能力不带入**:
    - 现实中的格斗冠军、特种兵、财阀,其肉体力量和金钱无法直接转化为系统数值
    - 相位空间战斗中,只有【战姬】和【道具】有效
    - 现实身份仅作为“资源获取渠道”,而非直接战斗力

无内测声明:
  - 系统日志第一条强制显示:
    "欢迎来到版本 1.0。本系统不存在内测阶段，不存在先行者。"

 
