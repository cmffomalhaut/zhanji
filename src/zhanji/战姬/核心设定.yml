    技能: 生成参照"<战姬技能>"

  性格修正:
    攻击系:
      固执: +攻-特攻
      孤僻: +攻-防
      勇敢: +攻-速
      调皮: +攻-特防
    特攻系:
      内敛: +特攻-攻
      稳重: +特攻-防
      冷静: +特攻-速
      马虎: +特攻-特防
    速度系:
      胆小: +速-攻
      急躁: +速-防
      开朗: +速-特攻
      天真: +速-特防
    防御系:
      大胆: +防-攻
