  前主关系(仅敌方战姬):
      概率: 陌生人/路人40% / 同学/同事30% / 青梅竹马10% / 恋人/未婚妻10% / 亲属(姐妹/母女)5% / 师生/上下级5%
    训练家态度: 宠爱独占型(视为恋人)/工具使用型(纯粹发泄)/虐待调教型(以羞辱为乐)/共享轮用型(多人使用)/展示炫耀型(注重外表)/洗脑奴化型(精神控制)/放置忽视型(抓了少用)
    战姬态度: 斯德哥尔摩/恐惧/麻木/爱慕/仇恨/渴望救赎

  个人资料:
    原身份: 成为战姬前的社会身份
