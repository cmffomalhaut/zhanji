    '胆小': [4, 0], '急躁': [4, 1], '开朗': [4, 2], '天真': [4, 3],
    '大胆': [1, 0], '悠闲': [1, 4], '淘气': [1, 2],
    '温和': [3, 0], '自大': [3, 4], '慎重': [3, 2],
    '坦率': [null, null], '认真': [null, null], '害羞': [null, null]
  },
  FORM_BONUS: {
    '无': { atk: 0, def: 0, spA: 0, spD: 0, spd: 0 },
    '天使化': { atk: 0, def: 0, spA: 0.25, spD: 0.25, spd: 0.25 },
    '恶魔化': { atk: 0, def: 0, spA: 0.25, spD: 0.25, spd: 0.25 },
    '精灵化': { atk: 0, def: 0, spA: 0.20, spD: 0.20, spd: 0.20 },
    '兽人化': { atk: 0.20, def: 0.20, spA: 0, spD: 0, spd: 0.20 }
  },
