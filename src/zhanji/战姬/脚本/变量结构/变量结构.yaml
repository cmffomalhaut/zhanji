const getRules = () => ({
  QUALITY: { 'E': [225, 10], 'D': [260, 12], 'C': [305, 14], 'B': [350, 16], 'A': [400, 18], 'S': [450, 20] },
  TALENT: { '平庸': 0.9, '普通': 1.0, '优秀': 1.1, '天才': 1.2 },
  COMBAT_TYPE: {
