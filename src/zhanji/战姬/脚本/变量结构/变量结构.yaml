// ====================================================================
// 1. 工具函数
// ====================================================================

function parseSafeNumber(val, defaultVal = 0) {
  if (typeof val === 'number') return isNaN(val) ? defaultVal : val;
  if (typeof val === 'string') {
    const cleaned = val.replace(/[^\d.-]/g, '');
    const num = Number(cleaned);
    return isNaN(num) ? defaultVal : num;
  }
  return defaultVal;
}

