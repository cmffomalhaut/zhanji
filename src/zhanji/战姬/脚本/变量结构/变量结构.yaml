    '强攻型': [0.30, 0.20, 0.10, 0.10, 0.30],
    '重盾型': [0.10, 0.40, 0.10, 0.30, 0.10],
    '魔导型': [0.10, 0.10, 0.40, 0.30, 0.10],
    '敏捷型': [0.20, 0.10, 0.20, 0.10, 0.40]
  },
  NATURE: {
    '固执': [0, 2], '孤僻': [0, 1], '勇敢': [0, 4], '调皮': [0, 3],
