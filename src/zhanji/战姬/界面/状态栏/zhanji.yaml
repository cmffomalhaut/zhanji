        var fac = $(this).data('swh-fac');
        assignSenkiToFacility(name, fac);
      });
      $scroll.off('click.swhDeposit').on('click.swhDeposit', '.senki-wh-btn[data-swh-deposit]', function(e) {
        e.stopPropagation();
        depositSenki($(this).data('swh-deposit'));
