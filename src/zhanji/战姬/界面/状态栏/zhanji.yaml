<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: #eee;
      font-size: 12px;
    }

    #app {
      width: 100%;
      aspect-ratio: 9 / 12;
      max-width: 100%;
      max-height: 600px;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #0f3460;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    #app.collapsed {
      aspect-ratio: auto;
      height: 44px;
    }
    #app.collapsed .main-content,
    #app.collapsed .bottom-nav {
      display: none;
    }

    .top-bar {
      height: 40px;
      background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
    }
    .top-left {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }
    .top-info {
      font-size: 13px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
      overflow: hidden;
    }
    .top-info span {
      white-space: nowrap;
    }
    .gold-badge {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #1a1a2e;
      padding: 3px 8px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }
    .top-btns {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-shrink: 0;
    }
    .top-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: #94a3b8;
      font-size: 13px;
      padding: 4px 6px;
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .top-btn:active {
      background: rgba(255,255,255,0.2);
    }
    .top-btn.spinning {
      animation: spin 0.5s ease-in-out;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .main-content {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .list-panel {
      display: none;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }
    .list-panel.active {
      display: flex;
    }
    .list-header {
      padding: 8px 12px;
      font-size: 16px;
      font-weight: bold;
      color: #e0e7ff;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }
    .list-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
      min-height: 0;
    }

    .category-header {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(79, 70, 229, 0.1) 100%);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      color: #a5b4fc;
      margin-bottom: 6px;
      margin-top: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .category-header:first-child {
      margin-top: 0;
    }
    .category-header .toggle-icon {
      font-size: 13px;
      transition: transform 0.2s;
    }
    .category-header.collapsed .toggle-icon {
      transform: rotate(-90deg);
    }
    .category-content {
      overflow: hidden;
    }
    .category-content.collapsed {
      display: none;
    }

    .list-item {
      background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.04) 100%);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 10px 12px;
