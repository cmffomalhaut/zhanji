      text-align: right;
      font-family: monospace;
      color: #94a3b8;
    }

    .section {
      margin-bottom: 6px;
    }
    .section-head {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.3) 0%, rgba(79, 70, 229, 0.2) 100%);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
