          actionBtn = '<button class="wh-action-btn claim-reward-btn"' + disabledAttr + ' data-quest-id="' + key + '" style="background:linear-gradient(135deg,#22c55e,#16a34a);color:white;font-size:11px;">领取</button>';
        } else {
