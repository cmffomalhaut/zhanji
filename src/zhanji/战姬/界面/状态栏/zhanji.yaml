      const gold = _.get(currentData, '金币', 0);
      const backpack = _.get(currentData, '背包', {});
      const itemsByCategory = {};
      SHOP_ITEMS.forEach(item => {
        if (!itemsByCategory[item.category]) itemsByCategory[item.category] = [];
